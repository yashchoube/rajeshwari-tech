<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Document Icon -->
  <g transform="translate(300, 200)">
    <!-- Document shape -->
    <path d="M 50 0 L 150 0 L 200 50 L 200 200 L 50 200 Z" 
          fill="white" fill-opacity="0.9"/>
    <path d="M 150 0 L 150 50 L 200 50" 
          fill="white" fill-opacity="0.6"/>
    
    <!-- Lines representing text -->
    <rect x="80" y="80" width="90" height="8" rx="4" fill="url(#bgGradient)" opacity="0.3"/>
    <rect x="80" y="100" width="90" height="8" rx="4" fill="url(#bgGradient)" opacity="0.3"/>
    <rect x="80" y="120" width="60" height="8" rx="4" fill="url(#bgGradient)" opacity="0.3"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="480" font-family="Arial, sans-serif" font-size="24" 
        fill="white" text-anchor="middle" font-weight="bold">
    Blog Image Placeholder
  </text>
</svg>
